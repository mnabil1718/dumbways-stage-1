<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/styles/styles.css" />
    <link rel="stylesheet" href="/static/styles/project-detail.css" />
    <script
      src="https://kit.fontawesome.com/7265fe3b83.js"
      crossorigin="anonymous"
    ></script>
	<title>Muhammad Nabil - {{project.name}}</title>
  </head>
  <body>
    <navigation-bar activate="/projects"></navigation-bar>
    <main>
      <a id="go-back" href="/projects"
        ><i class="fa-solid fa-chevron-left"></i><span>Back</span></a
      >
      <header id="title">
        <h1 id="name">Dumbways Web App</h1>
      </header>
      <div id="hero" class="mb-5">
		<img id="image" src="/static/uploads/{{project.imageUrl}}" alt="{{project.name}}" />
        <aside>
          <section id="duration" class="mb-3">
            <h2>Duration</h2>
            <div class="d-flex align-items-center gap-2 mb-2">
              <span><i class="fa-regular fa-calendar fa-lg"></i></span>
			    <span id="dateRange">{{toHumanReadable project.startDate}} - {{toHumanReadable project.endDate}}</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span><i class="fa-regular fa-clock fa-lg"></i></span>
			    <span id="dateDuration">{{dateDelta project.startDate project.endDate}}</span>
            </div>
          </section>
          <section id="technology">
            <h2>Technologies</h2>
            <ul id="technology">
	      {{#each project.technology}}
	          <li>{{this}}</li>
	      {{/each}}
            </ul>
          </section>
        </aside>
      </div>
      <article id="description">
        <p id="description">
	    {{project.description}}
        </p>
      </article>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/static/scripts/components/navigation-bar.js"></script>
    <script type="module" src="/static/scripts/components/project-card.js"></script>
    <script type="module" src="/static/scripts/components/cancel-button.js"></script>
  </body>
</html>
